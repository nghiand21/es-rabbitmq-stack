# Chế độ private: không có domain. Traefik chỉ còn RabbitMQ GUI, truy cập bằng
# https://<IP public>:15672 (cert tự ký của Traefik), giới hạn IP công ty.
# ES và AMQP đi thẳng qua IP private, không qua Traefik.
http:
  routers:
    rabbitmq-gui:
      entryPoints: [rabbitmq-gui]
      rule: 'PathPrefix(`/`)'
      service: rabbitmq-gui
      middlewares: [office-only]
      tls: {}
  middlewares:
    office-only:
      ipAllowList:
        sourceRange: [{{ env "RABBITMQ_GUI_ALLOW_IPS" }}]
  services:
    rabbitmq-gui:
      loadBalancer:
        servers:
          - url: "http://rabbitmq:15672"

tls:
  options:
    default:
      minVersion: VersionTLS12
