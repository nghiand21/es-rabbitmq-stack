# Chế độ private: Traefik chỉ còn RabbitMQ GUI (public, giới hạn IP công ty).
# ES và AMQP đi thẳng qua IP private, không qua Traefik.
http:
  routers:
    rabbitmq-gui:
      entryPoints: [rabbitmq-gui]
      rule: 'Host(`{{ env "DOMAIN" }}`)'
      service: rabbitmq-gui
      middlewares: [office-only]
      tls:
        certResolver: le
  middlewares:
    office-only:
      ipAllowList:
        sourceRange: [{{ env "RABBITMQ_GUI_ALLOW_IPS" }}]
  services:
    rabbitmq-gui:
      loadBalancer:
        servers:
          - url: "http://rabbitmq:15672"

tls:
  options:
    default:
      minVersion: VersionTLS12
