services:
  traefik:
    image: traefik:${TRAEFIK_VERSION}
    container_name: traefik
    restart: unless-stopped
    command:
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --entrypoints.web.address=:80            # chỉ dùng để xin/renew SSL
      - --entrypoints.es.address=:9200
      - --entrypoints.rabbitmq-gui.address=:15672
      - --entrypoints.amqps.address=:5671
      - --entrypoints.amqps.transport.respondingTimeouts.readTimeout=0
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
      - --log.format=json
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "9200:9200"
      - "15672:15672"
      - "5671:5671"
    volumes:
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - letsencrypt:/letsencrypt
    networks:
      - proxy

  es:
    image: elasticsearch:${ES_VERSION}
    container_name: es
    restart: unless-stopped
    environment:
      cluster.name: es-cluster
      bootstrap.memory_lock: "true"
      discovery.type: single-node
      network.host: 0.0.0.0
      ES_JAVA_OPTS: "-Xms2g -Xmx2g -Dlog4j2.formatMsgNoLookups=true"
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
      xpack.security.enabled: "true"
    ulimits:
      memlock: { soft: -1, hard: -1 }
    volumes:
      - esdata:/usr/share/elasticsearch/data
    networks:
      - proxy

  rabbitmq:
    image: rabbitmq:${RABBITMQ_VERSION}
    container_name: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    networks:
      - proxy

  es-writer:
    image: ${ES_WRITER_IMAGE}
    container_name: es-writer
    restart: unless-stopped
    depends_on:
      - es
      - rabbitmq
    environment:
      - RABBITMQ_URL=amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672/
      - RABBITMQ_ROUTING_KEY=es.writer
      - ES_URL=http://es:9200/?sniff=false
      - ES_USERNAME=elastic
      - ES_PASSWORD=${ELASTIC_PASSWORD}
    networks:
      - proxy

networks:
  proxy:
    external: true

volumes:
  esdata:
  letsencrypt:
