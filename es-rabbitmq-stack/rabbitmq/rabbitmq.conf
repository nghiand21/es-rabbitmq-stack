# Nạp vào /etc/rabbitmq/conf.d/90-stack.conf
# AMQP plaintext chỉ lắng nghe trong network internal; TLS 5671 do Traefik đảm nhiệm.
listeners.tcp.default = 5672
management.tcp.port   = 15672
prometheus.tcp.port   = 15692

# guest chỉ login từ loopback (bootstrap script sẽ xoá hẳn guest)
loopback_users.guest = true

# Structured logging ra stdout (Loki/Promtail đọc được)
log.console           = true
log.console.level     = info
log.console.formatter = json
log.file              = false

# Bảo vệ tài nguyên
vm_memory_high_watermark.relative = 0.6
disk_free_limit.absolute          = 2GB
heartbeat                         = 60
channel_max                       = 128
max_message_size                  = 16777216

# Management UI: không show hint, session timeout 60 phút
management.login_session_timeout = 60
management.disable_basic_auth    = false
