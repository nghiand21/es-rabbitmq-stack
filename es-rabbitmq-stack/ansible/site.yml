---
# Host prep + deploy cho ES/RabbitMQ stack. Idempotent, chạy được trên AWX.
#   ansible-playbook -i inventory.ini site.yml -e @group_vars/es_stack.yml -e @secrets.vault.yml --ask-vault-pass
- name: Deploy ES + RabbitMQ stack
  hosts: es_stack
  become: true
  vars:
    docker_packages: [docker-ce, docker-ce-cli, containerd.io, docker-buildx-plugin, docker-compose-plugin]
    required_secrets: [elastic_password, es_writer_pass, es_app_pass, es_reader_pass,
                       rmq_admin_pass, rmq_eswriter_pass, rmq_publisher_pass]

  pre_tasks:
    - name: Assert secrets are injected (AWX credential / vault)
      ansible.builtin.assert:
        that: required_secrets | map("extract", vars) | map("length") | min >= 16
        fail_msg: "Missing or weak secret(s): {{ required_secrets | join(', ') }} (min 16 chars)"
        quiet: true
      no_log: true

  tasks:
    # ---------------------------------------------------------------- packages
    - name: Install base packages
      ansible.builtin.apt:
        name: [ca-certificates, curl, gnupg, jq, git, openssl, iproute2, ufw]
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Add Docker apt key
      ansible.builtin.get_url:
        url: "https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg"
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Add Docker apt repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch={{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' }}
          signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/{{ ansible_distribution | lower }}
          {{ ansible_distribution_release }} stable
        filename: docker
        state: present

    - name: Install Docker Engine + Compose v2
      ansible.builtin.apt:
        name: "{{ docker_packages }}"
        state: present
        update_cache: true

    - name: Docker daemon hardening
      ansible.builtin.template:
        src: daemon.json.j2
        dest: /etc/docker/daemon.json
        mode: "0644"
      notify: Restart docker

    # ------------------------------------------------------------- kernel/ES
    - name: Kernel params for Elasticsearch
      ansible.posix.sysctl:
        name: "{{ item.k }}"
        value: "{{ item.v }}"
        sysctl_file: /etc/sysctl.d/90-elasticsearch.conf
        reload: true
      loop:
        - { k: vm.max_map_count, v: "262144" }
        - { k: vm.swappiness, v: "1" }

    # ---------------------------------------------------------------- firewall
    # Lưu ý: port Docker publish (80/443/5671) BỎ QUA ufw. Lọc IP cho dịch vụ
    # được làm ở Traefik ipAllowList; ufw chỉ bảo vệ SSH và các port của host.
    - name: UFW allow SSH from admin CIDRs
      community.general.ufw:
        rule: allow
        port: "22"
        proto: tcp
        src: "{{ item }}"
      loop: "{{ admin_ssh_cidrs }}"

    - name: UFW allow edge ports
      community.general.ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop: ["80", "443", "5671"]

    - name: UFW default deny + enable
      community.general.ufw:
        state: enabled
        policy: deny
        direction: incoming

    # ------------------------------------------------------------------ deploy
    - name: Checkout stack repo
      ansible.builtin.git:
        repo: "{{ stack_repo_url }}"
        dest: "{{ stack_dir }}"
        version: "{{ stack_repo_version }}"
        force: false
      register: repo

    - name: Render .env from inventory + vault
      ansible.builtin.template:
        src: env.j2
        dest: "{{ stack_dir }}/.env"
        owner: root
        group: root
        mode: "0600"
      no_log: true
      register: envfile

    - name: Write ACME DNS token (dns mode only)
      ansible.builtin.copy:
        content: "{{ acme_dns_token }}"
        dest: "{{ stack_dir }}/secrets/acme_dns_token"
        mode: "0600"
      no_log: true
      when: stack_acme_mode == 'dns'

    - name: Flush handlers (docker restart before deploy)
      ansible.builtin.meta: flush_handlers

    - name: make deploy (preflight -> up -> bootstrap -> es-writer)
      ansible.builtin.command:
        cmd: make deploy
        chdir: "{{ stack_dir }}"
      when: repo.changed or envfile.changed or (force_deploy | default(false) | bool)
      changed_when: true

  handlers:
    - name: Restart docker
      ansible.builtin.systemd:
        name: docker
        state: restarted
